<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmployeeDesk | E-mail enviado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#223240] text-white antialiased">
  <main class="relative flex min-h-screen items-center justify-center p-0 sm:p-6">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(96,191,129,0.12),_transparent_35%),radial-gradient(circle_at_bottom,_rgba(59,140,86,0.10),_transparent_40%)]"></div>

    <section class="relative z-10 w-full max-w-[560px] rounded-none border border-white/5 bg-[#1c2b38]/90 p-6 shadow-2xl shadow-black/40 backdrop-blur-sm sm:rounded-2xl sm:p-10 text-center">
      <span class="mx-auto mb-4 inline-flex h-16 w-16 items-center justify-center rounded-full bg-[#9FD948]/15 text-3xl text-[#9FD948]">✓</span>
      <h1 class="text-2xl font-semibold">Verifique seu e-mail</h1>
      <p class="mt-3 text-sm text-slate-300">Se existir uma conta com esse endereço, enviaremos as instruções de redefinição.</p>
      <a href="{% url 'account_login' %}" class="mt-6 inline-flex rounded-md bg-[#9FD948] px-4 py-2.5 text-sm font-semibold uppercase tracking-wide text-[#1d2a35] transition hover:brightness-95">
        Voltar ao login
      </a>
    </section>
  </main>
</body>
</html>
